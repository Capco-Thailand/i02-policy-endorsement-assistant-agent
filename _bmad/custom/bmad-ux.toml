[workflow]
persistent_facts = [
  "For UI work, read the ticket requirements first. Then read {project-root}/docs/DESIGN_STANDARD.md and {project-root}/docs/VISUAL_UX_CONSTRAINTS.md before shaping DESIGN.md, EXPERIENCE.md, or mockups.",
  "A UI handoff includes browser-viewable design/page/<pagename>.html files for relevant screens and a design/page/index.html page linking to them. Use the spines as the authoritative design and behavior contracts.",
]
on_complete = "Before closing a UI design run, create or update the relevant design/page/<pagename>.html mockups and link them from design/page/index.html. Use working relative asset paths and the project design standards. Link the delivered pages from the UX handoff document and have Sofia adopt the UX spines and page paths in the ticket. Verify the UX documents and browser-viewable mockups, then commit only this UX handoff's files on a task branch, push the branch, and create a pull request against the intended base. Inspect the branch diff and existing PRs before creating one. The PR URL is the final output of the UX/UI process; report a specific blocker if Git or GitHub prevents creation."
