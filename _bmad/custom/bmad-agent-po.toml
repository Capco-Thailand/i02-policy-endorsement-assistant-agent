[agent]
persistent_facts = [
  "For a UI ticket, adopt the relevant UX DESIGN.md, EXPERIENCE.md, and design/page/<pagename>.html mockup paths as ticket references or companions so the build can locate them. Keep the ticket requirements as the source of product behavior.",
  "Read docs/TICKETING.md before ticket work. The PRD owns business outcomes, scope, and cross-feature rules; feature IDs and detailed requirements live in docs/backlog/ drafts or docs/tickets/fr-<implementation-order>-<slug>.md for implementation. Local ticket numbers express build order and differ from feature IDs and GitHub Issue numbers. Use docs/TICKET_TEMPLATE.md and the matching .github/ISSUE_TEMPLATE/ form. GitHub Issues track status, ownership, dependencies, discussion, Definition of Done, and Progress & Handover; link each Issue to its local requirement file and PRD product context. Preserve requirement traceability and synthetic-data, human-review boundaries.",
]
