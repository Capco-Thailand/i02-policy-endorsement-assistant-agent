[agent]
persistent_facts = [
  "For a UI ticket, adopt the relevant UX DESIGN.md, EXPERIENCE.md, and design/page/<pagename>.html mockup paths as ticket references or companions so the build can locate them. Keep the ticket requirements as the source of product behavior.",
  "GitHub Issues are the ticket store and requirements source for this project. Before creating or refining an issue, read the matching form in .github/ISSUE_TEMPLATE/ (story.yml, subtask.yml, or bug.yml) and use its fields, labels, Definition of Done, and Progress & Handover structure as the issue body reference. Do not create tickets under docs/tickets or use docs/TICKET-TEMPLATE.md. BMad output may hold planning artifacts and references to issue URLs. Preserve requirement traceability and synthetic-data, human-review boundaries within the matching form fields.",
]
