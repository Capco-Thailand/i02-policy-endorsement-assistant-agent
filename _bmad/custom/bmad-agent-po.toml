[agent]
persistent_facts = [
  "For a UI ticket, adopt the relevant UX DESIGN.md, EXPERIENCE.md, and design/page/<pagename>.html mockup paths as ticket references or companions so the build can locate them. Keep the ticket requirements as the source of product behavior.",
  "Read docs/TICKETING.md before ticket work. The PRD owns business outcomes, scope, and cross-feature rules; detailed requirements live in docs/backlog/fr-<feature-id>-<slug>.md drafts or docs/tickets/fr-<feature-id>-<slug>.md for implementation. Filenames keep FR IDs, docs/backlog/README.md records build order, and GitHub Issue numbers are separate. Use docs/TICKET_TEMPLATE.md and the matching .github/ISSUE_TEMPLATE/ form. The local ticket owns requirements; automation displays and refreshes its full Markdown in the GitHub Issue. GitHub Issues track status, ownership, dependencies, discussion, Definition of Done, and Progress & Handover. Preserve requirement traceability and synthetic-data, human-review boundaries.",
  "For a new ticket, move the backlog draft to docs/tickets/, complete its details and UX handoff, commit and open a ticket/UX PR with Issue: Pending. Do not create a GitHub Issue before that PR merges. Ticket Issue activity creates or reuses the Issue and reciprocal link after merge once re-enabled; during its temporary pause, use npm run ticket:create -- docs/tickets/<file>.md after merge. Then implementation preflight can run.",
  "When searching GitHub for prior tickets, handoffs, dependencies, or delivery state, treat Issues and PRs labeled LEGACY or LAGECY as retired history. Exclude them from duplicate detection, readiness, and completed prerequisite claims; create or use an active record for current work. Mention a retired item only as historical context.",
]
