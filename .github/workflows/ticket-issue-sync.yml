name: Ticket Issue activity
on:
  pull_request_target:
    types: [closed]
    branches: [main, test/create-ticket]
  push:
    branches: [main, test/create-ticket]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set ticket content branch
        run: echo "TICKET_CONTENT_REF=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Create Issue after ticket handoff merge
        if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ticket-workflow.mjs publish-merged
      - name: Update Issue automation section
        if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ticket-workflow.mjs sync
      - name: Sync Issue activity after merge
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ticket-workflow.mjs sync-all
