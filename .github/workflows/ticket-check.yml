name: Ticket links
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pea
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: pea_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U pea -d pea_test'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pea:synthetic_test_only@localhost:5432/pea_test
      TEST_DATABASE_URL: postgresql://pea:synthetic_test_only@localhost:5432/pea_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate ticket links
        id: ticket
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ticket-workflow.mjs check
      - uses: actions/setup-node@v4
        if: steps.ticket.outputs.implementation == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install implementation dependencies
        if: steps.ticket.outputs.implementation == 'true'
        run: npm ci
      - name: Migrate and seed synthetic database
        if: steps.ticket.outputs.implementation == 'true'
        run: npm run db:migrate -w apps/api && npm run db:seed -w apps/api
      - name: Test implementation
        if: steps.ticket.outputs.implementation == 'true'
        run: npm test
      - name: Typecheck implementation
        if: steps.ticket.outputs.implementation == 'true'
        run: npm run typecheck
      - name: Check implementation formatting
        if: steps.ticket.outputs.implementation == 'true'
        run: npm run format:check
      - name: Build implementation
        if: steps.ticket.outputs.implementation == 'true'
        run: npm run build
      - name: Install Chromium
        if: steps.ticket.outputs.implementation == 'true'
        run: npx playwright install --with-deps chromium
      - name: Test browser E2E
        if: steps.ticket.outputs.implementation == 'true'
        run: |
          if grep -q 'docs/tickets/chore-migrate-persistence-to-neon.md' "$GITHUB_EVENT_PATH" || [[ "$GITHUB_HEAD_REF" == *chore-migrate-persistence-to-neon* ]]; then
            E2E_TICKET_ID=chore-migrate-persistence-to-neon npm run test:e2e
          else
            npm run test:e2e
          fi
      - name: Upload E2E report
        if: always() && steps.ticket.outputs.implementation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn

