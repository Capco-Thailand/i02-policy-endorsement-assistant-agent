name: Merge validated ticket or implementation
on:
  workflow_run:
    workflows: [Ticket links]
    types: [completed]
permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write
jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enable auto-merge for validated ticket or implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ticket-workflow.mjs auto-merge

