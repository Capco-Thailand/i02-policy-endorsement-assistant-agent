name: Ticket drift
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  reconcile:
    # Pause drift validation until ticket checks are restored.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Issue activity for drift
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ticket-workflow.mjs reconcile
