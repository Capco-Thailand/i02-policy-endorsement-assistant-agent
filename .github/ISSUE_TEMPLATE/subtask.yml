name: Subtask
description: Track a bounded piece of work under a parent Issue.
title: "[Subtask] "
labels: ["type:subtask"]
body:
  - type: markdown
    attributes:
      value: |
        Apply at least one relevant `role:product`, `role:design`, `role:qa`, or `role:dev` label after creation. Use `needs:human-review` only while a human decision or review is pending; remove it when resolved. Add this Issue as a native sub-issue of its parent where available. Before implementation, read the parent, dependencies, and repository context. Work to the acceptance criteria, record test results, and update Progress & Handover before stopping. Implementation does not count as human approval.
  - type: input
    id: parent
    attributes:
      label: Parent Issue
      placeholder: "#123 or full Issue URL"
    validations:
      required: true
  - type: input
    id: objective
    attributes:
      label: Objective
      placeholder: What outcome should this subtask deliver?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Implementation scope
      description: Describe the bounded work and any exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Observable result and conditions"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisites; use None if there are none.
  - type: textarea
    id: files
    attributes:
      label: Relevant files or components
      description: Add paths or links when known; use N/A otherwise.
  - type: textarea
    id: tests
    attributes:
      label: Test requirements
      description: Name applicable checks and expected evidence; use N/A if none apply.
  - type: checkboxes
    id: done
    attributes:
      label: Definition of Done
      description: Check only applicable items as work is completed.
      options:
        - label: Acceptance criteria satisfied
        - label: Applicable tests completed
        - label: Relevant documentation updated
        - label: Code review completed, if applicable
        - label: CI checks passed, if applicable
        - label: Related Issues and PRs linked
        - label: Progress and handover updated
        - label: No unresolved blockers
  - type: textarea
    id: handover
    attributes:
      label: Progress & Handover
      description: Edit this section in the Issue body before stopping or transferring work. Use Status values Not Started, In Progress, Blocked, In Review, or Done. Link evidence and record the update date; use N/A where a field does not apply.
      value: |
        - **Status:** Not Started
        - **Completed:** N/A
        - **Remaining:** N/A
        - **Branch:** N/A
        - **PR:** N/A
        - **Latest Test/CI Result:** N/A
        - **Blockers:** N/A
        - **Dependencies:** N/A
        - **Next Action:** N/A
        - **Context Links:** N/A
        - **Last Updated:** N/A
