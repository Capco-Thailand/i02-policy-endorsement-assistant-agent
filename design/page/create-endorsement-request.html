<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create endorsement request — design preview</title>
  <link rel="stylesheet" href="../global.css">
  <style>
    .request-shell{max-width:780px;margin:40px auto;padding:0 24px;color:#0a2540}.request-card{background:#fff;border:1px solid #dce6ef;border-radius:10px;padding:24px;margin:20px 0}.request-grid{display:grid;gap:18px}.request-grid label{display:grid;gap:6px;font-weight:600}.request-grid input,.request-grid select,.request-grid textarea{font:inherit;padding:10px;border:1px solid #8899aa;border-radius:6px;width:100%;box-sizing:border-box}.request-grid :focus-visible{outline:3px solid #5148d9;outline-offset:2px}.request-grid button{background:#635bff;color:white;border:0;border-radius:6px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.notice{padding:12px;border:1px solid #dce6ef;border-radius:6px}.error{color:#a22d37}.hidden{display:none}
  </style>
</head>
<body>
  <header class="site-header"><span class="brand-mark" aria-hidden="true">PE</span><span>Policy Endorsement Assistant<small>Design preview · synthetic data</small></span></header>
  <main class="request-shell">
    <p><a href="index.html">All previews</a></p>
    <h1>Create endorsement request</h1>
    <p>This request does not change coverage. It remains pending checks and human review.</p>
    <section class="request-card" aria-label="Selected policy"><strong>Selected synthetic policy</strong><p>POL-1001 · ACTIVE · Assigned to Alice</p></section>
    <form class="request-card request-grid" id="request-form">
      <label>Change type<select id="change" required><option value="">Select a change</option><option value="beneficiary">Beneficiary</option><option value="address">Correspondence address</option><option value="frequency">Payment frequency</option><option value="rider">Accidental-death rider</option></select></label>
      <label>Requested effective date<input type="date" required></label>
      <div id="beneficiary" class="request-grid hidden"><label>Beneficiary name<input type="text"></label><label>Intended allocation (%)<input type="number" min="0" max="100"></label></div>
      <div id="address" class="request-grid hidden"><label>New correspondence address<textarea rows="3"></textarea></label></div>
      <div id="frequency" class="request-grid hidden"><label>Requested payment frequency<select><option value="">Select frequency</option><option>Monthly</option><option>Quarterly</option><option>Annually</option></select></label></div>
      <div id="rider" class="request-grid hidden"><label>Rider change<select><option value="">Select action</option><option>Add</option><option>Remove</option></select></label></div>
      <p id="result" class="notice hidden" role="status" tabindex="-1"></p>
      <button type="submit">Record request</button>
    </form>
  </main>
  <script src="create-endorsement-request.js"></script>
</body>
</html>
