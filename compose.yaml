services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
    command: npm run dev:api
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
    command: npm run dev:web

volumes:
  workspace_node_modules:
